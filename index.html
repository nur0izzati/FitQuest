<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitQuest: Room-Scale Steering Drive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    :root {
      --primary: #00ff66;
      --danger: #ff3333;
      --bg: #090a0f;
      --panel: rgba(18, 20, 28, 0.9);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-stack);
      background: var(--bg);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1c1f2e 0%, #090a0f 100%);
      overflow: hidden;
    }

    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 15, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #00b347 100%);
      border: none;
      color: #000;
      padding: 16px 45px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 255, 102, 0.35);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sprite {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      left: 0;
      top: 0;
      will-change: transform;
    }

    #player {
      background: linear-gradient(135deg, var(--primary) 0%, #00bcff 100%);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
      transform: translate3d(0,0,0);
    }

    #enemy {
      background: linear-gradient(135deg, var(--danger) 0%, #730000 100%);
      box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
      transform: translate3d(0,0,0);
    }

    .projectile {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ffea00;
      border-radius: 50%;
      box-shadow: 0 0 18px #ff3333;
      left: 0;
      top: 0;
      will-change: transform;
    }

    .melee-strike { animation: meleeMotion 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .take-damage { animation: damageFlash 0.1s linear 3; }

    @keyframes meleeMotion {
      0% { transform: scale(1) translate3d(0,0,0); }
      40% { transform: scale(1.25) translate3d(15px, -5px, 0); filter: brightness(1.4); }
      100% { transform: scale(1) translate3d(0,0,0); }
    }

    @keyframes damageFlash {
      0% { opacity: 1.0; filter: brightness(1); }
      50% { opacity: 0.4; filter: brightness(2.5) saturate(2); }
      100% { opacity: 1.0; filter: brightness(1); }
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px;
      z-index: 10;
    }

    .top-hud { display: flex; justify-content: space-between; width: 100%; }
    .hud-card { width: 42%; }

    .bar-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #8e95a5;
      font-weight: 600;
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: #191b24;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .bar-fill { height: 100%; width: 100%; transition: width 0.2s cubic-bezier(0.1, 0.8, 0.2, 1); }
    #p-hp-fill { background: linear-gradient(90deg, #00ff66, #00d4ff); }
    #e-hp-fill { background: linear-gradient(90deg, #ff3333, #ff9900); }

    .bottom-deck {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #combat-feed {
      font-size: 1.05rem;
      font-weight: 700;
      color: #00e5ff;
      margin-bottom: 4px;
      height: 24px;
    }

    .telemetry-subtext {
      font-size: 0.8rem;
      color: #696f7d;
      font-weight: 500;
    }

    #joy-container {
      position: absolute;
      bottom: 150px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50; 
    }

    #joy-knob {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }

    #monitor-panel {
      position: absolute;
      top: 90px;
      left: 25px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #494d5a;
      pointer-events: none;
      text-align: left;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="overlay" class="screen-overlay">
    <h1 style="font-size: 2.2rem; letter-spacing: 3px; margin: 0 0 10px 0; color: var(--primary);">ROOM EDITION v4</h1>
    <p style="color: #798092; margin-bottom: 35px; max-width: 320px; font-size: 0.95rem; line-height: 1.6;">
      Aim your direction with the <b>Joystick</b>.<br><br>
      <span style="color: #ffaa00; font-weight: 600;">🕹️ Joystick alone will NOT move you.</span><br>
      <span style="color: var(--primary); font-weight: 600;">👟 Take light steps or pump your hands slightly in place to slide! No running required.</span>
    </p>
    <button class="cta-btn" onclick="requestHardwarePermissions()">Start Fight</button>
  </div>

  <div id="monitor-panel"></div>

  <div id="player" class="sprite"></div>
  <div id="enemy" class="sprite"></div>

  <div id="joy-container">
    <div id="joy-knob"></div>
  </div>

  <div id="ui-layer">
    <div class="top-hud">
      <div class="hud-card">
        <div class="bar-label">Your Vitals</div>
        <div class="bar-track"><div id="p-hp-fill" class="bar-fill"></div></div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="bar-label">Stationary Boss</div>
        <div class="bar-track"><div id="e-hp-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div class="bottom-deck">
      <div id="combat-feed">Ready to play</div>
      <div class="telemetry-subtext" id="engine-status">Speed Output: 0 px/s</div>
    </div>
  </div>
</div>

<script>
  const ENGINE_CONFIG = {
    // Ultra sensitive threshold for indoor/room scale activity tracking
    lowPassFilterFactor: 0.3,   
    motionStepFloor: 0.2,       // Dropped massively so light steps or slight phone shakes register instantly
    combatShakeFloor: 12.0,     
    attackInterval: 400,        
    
    momentumDecay: 4.0,         
    kineticInputGain: 95.0,     // Magnified calculation boost so low effort movement equals fast speeds
    velocityCeiling: 550.0,     
    combatContactZone: 95.0,    
    joystickRadius: 55,

    bossAttackCooldown: 2000,   
    fireballSpeed: 210.0        
  };

  let runtime = {
    pX: 0, pY: 0,
    eX: 0, eY: 0,
    pVx: 0, pVy: 0,             
    lastFrameTime: 0,
    isHalted: false,
    joystickTracking: false,
    isDesktopFallback: false,    
    
    aimVectorX: 0, aimVectorY: 0,
    
    smoothedX: 0, smoothedY: 0, smoothedZ: 0,
    lastStepTimestamp: 0,
    workoutBoostVel: 0,         
    
    pHero: 100, eBoss: 100,
    lastCombatExecution: 0,
    lastBossAttackTime: 0,
    
    projectiles: [] 
  };

  const DOM = {
    container: document.getElementById('game-container'),
    overlay: document.getElementById('overlay'),
    player: document.getElementById('player'),
    enemy: document.getElementById('enemy'),
    pHP: document.getElementById('p-hp-fill'),
    eHP: document.getElementById('e-hp-fill'),
    feed: document.getElementById('combat-feed'),
    metrics: document.getElementById('engine-status'),
    joyZone: document.getElementById('joy-container'),
    joyKnob: document.getElementById('joy-knob'),
    diagnostic: document.getElementById('monitor-panel')
  };

  function requestHardwarePermissions() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') bootEngineCore();
          else fallbackToSimulatorMode();
        })
        .catch(() => fallbackToSimulatorMode());
    } else {
      if (navigator.userAgent.match(/Android|iPhone|iPad|iPod/i)) {
        bootEngineCore(); // Force try on Android variants if permission handles don't exist
      } else {
        runtime.isDesktopFallback = true;
        bootEngineCore();
      }
    }
  }

  function fallbackToSimulatorMode() {
    runtime.isDesktopFallback = true;
    bootEngineCore();
  }

  function bootEngineCore() {
    DOM.overlay.style.display = 'none';
    
    runtime.pX = window.innerWidth * 0.15;
    runtime.pY = window.innerHeight * 0.5 - 32;
    runtime.eX = window.innerWidth - 120;
    runtime.eY = window.innerHeight * 0.5 - 32;
    
    // Always attach mobile event updates just in case hardware tracking handshake is valid
    window.addEventListener('devicemotion', processSensorSignal, { passive: false });
    
    if (runtime.isDesktopFallback || !('DeviceMotionEvent' in window)) {
      setupDesktopSimulatorHooks();
    }
    
    bindJoystickInterface();
    
    runtime.lastFrameTime = performance.now();
    runtime.lastBossAttackTime = performance.now();
    requestAnimationFrame(gameEngineTick);
  }

  function processSensorSignal(event) {
    if (runtime.isHalted) return;
    
    let rawAccel = event.acceleration || event.accelerationIncludingGravity;
    if (!rawAccel) return;

    let alpha = ENGINE_CONFIG.lowPassFilterFactor;
    // Track dynamic changes across room frame coords
    runtime.smoothedX = runtime.smoothedX + alpha * ((rawAccel.x || 0) - runtime.smoothedX);
    runtime.smoothedY = runtime.smoothedY + alpha * ((rawAccel.y || 0) - runtime.smoothedY);
    runtime.smoothedZ = runtime.smoothedZ + alpha * ((rawAccel.z || 0) - runtime.smoothedZ);

    let currentNetMagnitude = Math.sqrt(runtime.smoothedX**2 + runtime.smoothedY**2 + runtime.smoothedZ**2);
    
    // Check gravity relative baseline changes
    let gravityOffsetDelta = Math.abs(currentNetMagnitude - 9.81); 
    let checkVal = event.acceleration ? currentNetMagnitude : gravityOffsetDelta;

    DOM.diagnostic.innerHTML = `ROOM MOTION ENERGY: ${checkVal.toFixed(2)}<br>THRESHOLD REQ: ${ENGINE_CONFIG.motionStepFloor}<br>STATUS: SENSORS ACTIVE`;

    if (checkVal > ENGINE_CONFIG.motionStepFloor) {
      // Light room movement detected - give a massive speed push instantly
      runtime.workoutBoostVel += checkVal * ENGINE_CONFIG.kineticInputGain;
    }

    // Secondary emergency tracking hook to make sure players don't get completely locked out
    if (checkVal > 4.0) {
      evaluateCombatInteraction();
    }
  }

  function bindJoystickInterface() {
    const boundaryNode = DOM.joyZone;
    const knobNode = DOM.joyKnob;
    const r = ENGINE_CONFIG.joystickRadius;

    function evaluateInputVector(clientX, clientY) {
      let zoneRect = boundaryNode.getBoundingClientRect();
      let originX = zoneRect.left + r;
      let originY = zoneRect.top + r;

      let dX = clientX - originX;
      let dY = clientY - originY;
      let hypotenuseLength = Math.sqrt(dX * dX + dY * dY);

      if (hypotenuseLength > r) {
        dX = (dX / hypotenuseLength) * r;
        dY = (dY / hypotenuseLength) * r;
        hypotenuseLength = r;
      }

      knobNode.style.transform = `translate3d(${dX}px, ${dY}px, 0px)`;
      knobNode.style.borderColor = "var(--primary)";

      runtime.aimVectorX = hypotenuseLength > 0 ? dX / r : 0;
      runtime.aimVectorY = hypotenuseLength > 0 ? dY / r : 0;
    }

    function breakTracking() {
      runtime.joystickTracking = false;
      knobNode.style.transform = `translate3d(0px, 0px, 0px)`;
      knobNode.style.borderColor = "rgba(255, 255, 255, 0.8)";
    }

    boundaryNode.addEventListener('touchstart', (e) => { runtime.joystickTracking = true; evaluateInputVector(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (runtime.joystickTracking) { evaluateInputVector(e.touches[0].clientX, e.touches[0].clientY); } }, { passive: true });
    window.addEventListener('touchend', breakTracking);

    boundaryNode.addEventListener('mousedown', (e) => { runtime.joystickTracking = true; evaluateInputVector(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => { if (runtime.joystickTracking) evaluateInputVector(e.clientX, e.clientY); });
    window.addEventListener('mouseup', breakTracking);
  }

  let virtualKeyArray = {};
  function setupDesktopSimulatorHooks() {
    runtime.isDesktopFallback = true;
    window.addEventListener('keydown', (e) => { 
      virtualKeyArray[e.code] = true; 
      if (e.code === 'Space') evaluateCombatInteraction();
      processKeyboardSteering();
    });
    window.addEventListener('keyup', (e) => { 
      virtualKeyArray[e.code] = false; 
      processKeyboardSteering();
    });
  }

  function processKeyboardSteering() {
    if (runtime.joystickTracking) return;
    runtime.aimVectorX = (virtualKeyArray['KeyD'] || virtualKeyArray['ArrowRight'] ? 1 : 0) - (virtualKeyArray['KeyA'] || virtualKeyArray['ArrowLeft'] ? 1 : 0);
    runtime.aimVectorY = (virtualKeyArray['KeyS'] || virtualKeyArray['ArrowDown'] ? 1 : 0) - (virtualKeyArray['KeyW'] || virtualKeyArray['ArrowUp'] ? 1 : 0);
    
    if (runtime.aimVectorX !== 0 && runtime.aimVectorY !== 0) {
      runtime.aimVectorX *= 0.7071;
      runtime.aimVectorY *= 0.7071;
    }
  }

  function processDesktopSimulatedPhysics(dt) {
    // Hold Shift to simulate gentle room movement on computer screens
    if (virtualKeyArray['ShiftLeft']) {
      runtime.workoutBoostVel += 480.0 * dt; 
    }
    DOM.diagnostic.innerHTML = `MODE: CLOSED-ROOM COMPUTER SIMULATOR<br>WASD/ARROWS = STEER ORIENTATION<br><span style="color:#00ff66">HOLD SHIFT = GENTLE STEPS ON THE SPOT</span><br>SPACEBAR = MELEE SHAKE ATTACK`;
  }

  function evaluateCombatInteraction() {
    if (runtime.isHalted) return;
    let clockTicks = performance.now();
    
    if (clockTicks - runtime.lastCombatExecution < ENGINE_CONFIG.attackInterval) return;
    runtime.lastCombatExecution = clockTicks;

    let distanceToTarget = Math.sqrt(((runtime.eX + 32) - (runtime.pX + 32))**2 + ((runtime.eY + 32) - (runtime.pY + 32))**2);

    if (distanceToTarget <= ENGINE_CONFIG.combatContactZone) {
      executeValidatedMeleeStrike();
    } else {
      // Emergency fall-back attack generation: if within right-half, allow damage connection
      if(runtime.pX > window.innerWidth * 0.5) {
         executeValidatedMeleeStrike();
      } else {
         DOM.feed.textContent = "❌ Walk closer to the right-side Boss arena!";
         DOM.feed.style.color = "#ffaa00";
      }
    }
  }

  function executeValidatedMeleeStrike() {
    DOM.player.classList.remove('melee-strike');
    void DOM.player.offsetWidth; 
    DOM.player.classList.add('melee-strike');

    runtime.eBoss = Math.max(runtime.eBoss - 20, 0);
    DOM.eBoss = runtime.eBoss;
    DOM.eHP.style.width = `${runtime.eBoss}%`;

    DOM.enemy.classList.remove('take-damage');
    void DOM.enemy.offsetWidth;
    DOM.enemy.classList.add('take-damage');

    DOM.feed.textContent = `💥 Smacked Boss! Target HP: ${runtime.eBoss}%`;
    DOM.feed.style.color = "var(--primary)";

    if (runtime.eBoss <= 0) declareEndGameState(true);
  }

  function gameEngineTick(currentFrameTimestamp) {
    if (runtime.isHalted) return;

    let deltaTime = (currentFrameTimestamp - runtime.lastFrameTime) / 1000;
    runtime.lastFrameTime = currentFrameTimestamp;

    if (deltaTime > 0.15) deltaTime = 0.15;

    if (runtime.isDesktopFallback) {
      processDesktopSimulatedPhysics(deltaTime);
    }

    // 1. Kinetic energy decay framework
    if (runtime.workoutBoostVel > 0) {
      runtime.workoutBoostVel -= ENGINE_CONFIG.momentumDecay * 75.0 * deltaTime;
      if (runtime.workoutBoostVel < 0) runtime.workoutBoostVel = 0;
    }

    if (runtime.workoutBoostVel > ENGINE_CONFIG.velocityCeiling) {
      runtime.workoutBoostVel = ENGINE_CONFIG.velocityCeiling;
    }

    // 2. Room Scale Structural Steering Compile Matrix
    if (runtime.workoutBoostVel > 2) {
      if (runtime.aimVectorX !== 0 || runtime.aimVectorY !== 0) {
        runtime.pVx = runtime.aimVectorX * runtime.workoutBoostVel;
        runtime.pVy = runtime.aimVectorY * runtime.workoutBoostVel;
      } else {
        // Slow down drift if joystick is let go
        runtime.pVx *= 0.85;
        runtime.pVy *= 0.85;
      }
    } else {
      // Dynamic fallback baseline: If mobile sensors are failing completely, 
      // automatically convert the joystick into a fallback engine so the game is unblocked!
      if (!runtime.isDesktopFallback && (runtime.aimVectorX !== 0 || runtime.aimVectorY !== 0)) {
         runtime.pVx = runtime.aimVectorX * 160.0;
         runtime.pVy = runtime.aimVectorY * 160.0;
      } else {
         runtime.pVx = 0;
         runtime.pVy = 0;
      }
    }

    // 3. Move coordinates
    runtime.pX += runtime.pVx * deltaTime;
    runtime.pY += runtime.pVy * deltaTime;

    // 4. Boundary Protection Arena Locks
    runtime.pX = Math.max(0, Math.min(window.innerWidth - 64, runtime.pX));
    runtime.pY = Math.max(0, Math.min(window.innerHeight - 64, runtime.pY));

    // 5. Fireball Spawner Clock Track
    if (currentFrameTimestamp - runtime.lastBossAttackTime > ENGINE_CONFIG.bossAttackCooldown) {
      runtime.lastBossAttackTime = currentFrameTimestamp;
      spawnBossProjectile();
    }

    processActiveProjectiles(deltaTime);

    DOM.player.style.transform = `translate3d(${runtime.pX}px, ${runtime.pY}px, 0px)`;
    DOM.enemy.style.transform = `translate3d(${runtime.eX}px, ${runtime.eY}px, 0px)`;

    refreshHUDLogs();

    requestAnimationFrame(gameEngineTick);
  }

  function spawnBossProjectile() {
    let bulletNode = document.createElement('div');
    bulletNode.className = 'projectile';
    DOM.container.appendChild(bulletNode);

    let bOriginX = runtime.eX + 24;
    let bOriginY = runtime.eY + 24;
    let targetVecX = (runtime.pX + 32) - bOriginX;
    let targetVecY = (runtime.pY + 32) - bOriginY;
    let vectorDistance = Math.sqrt(targetVecX * targetVecX + targetVecY * targetVecY) || 1;

    let projObject = {
      dom: bulletNode,
      x: bOriginX,
      y: bOriginY,
      vX: (targetVecX / vectorDistance) * ENGINE_CONFIG.fireballSpeed,
      vY: (targetVecY / vectorDistance) * ENGINE_CONFIG.fireballSpeed
    };

    runtime.projectiles.push(projObject);
  }

  function processActiveProjectiles(dt) {
    for (let i = runtime.projectiles.length - 1; i >= 0; i--) {
      let b = runtime.projectiles[i];
      b.x += b.vX * dt;
      b.y += b.vY * dt;

      b.dom.style.transform = `translate3d(${b.x}px, ${b.y}px, 0px)`;

      if (b.x < -20 || b.x > window.innerWidth + 20 || b.y < -20 || b.y > window.innerHeight + 20) {
        b.dom.remove();
        runtime.projectiles.splice(i, 1);
        continue;
      }

      let pCenterX = runtime.pX + 32;
      let pCenterY = runtime.pY + 32;
      let projectileDistance = Math.sqrt((pCenterX - (b.x + 9))**2 + (pCenterY - (b.y + 9))**2);

      if (projectileDistance < 38) {
        runtime.pHero = Math.max(runtime.pHero - 15, 0);
        DOM.pHP.style.width = `${runtime.pHero}%`;
        DOM.feed.textContent = "💥 Took a hit! Keep moving your hands/feet to escape!";
        DOM.feed.style.color = "var(--danger)";

        DOM.player.classList.remove('take-damage');
        void DOM.player.offsetWidth;
        DOM.player.classList.add('take-damage');

        b.dom.remove();
        runtime.projectiles.splice(i, 1);

        if (runtime.pHero <= 0) declareEndGameState(false);
      }
    }
  }

  function refreshHUDLogs() {
    let currentSpeed = Math.round(Math.sqrt(runtime.pVx**2 + runtime.pVy**2));
    if (currentSpeed > 5) {
      DOM.metrics.textContent = `👟 Room Motion Active! Speed: ${currentSpeed} px/s. Hold & steer!`;
      DOM.metrics.style.color = "var(--primary)";
    } else {
      DOM.metrics.textContent = `🛑 Standing Idle • Lightly pump phone or step to move`;
      DOM.metrics.style.color = "#696f7d";
    }
  }

  function declareEndGameState(victory) {
    runtime.isHalted = true;
    runtime.projectiles.forEach(b => b.dom.remove());
    runtime.projectiles = [];

    DOM.feed.textContent = victory ? "🏆 DUNGEON CLEAR!" : "❌ DEFEATED!";
    DOM.feed.style.color = victory ? "var(--primary)" : "var(--danger)";
    
    setTimeout(() => {
      DOM.overlay.innerHTML = `
        <h1 style="color: ${victory ? 'var(--primary)' : 'var(--danger)'}; letter-spacing: 2px;">
          ${victory ? 'QUEST COMPLETE' : 'SESSION ENDED'}
        </h1>
        <p style="color: #8e95a5; margin-bottom: 25px; font-size:0.95rem;">
          ${victory ? 'Excellent room pacing! Boss cleared successfully.' : 'Your health hit zero. Take a deep breath and let\'s try again!'}
        </p>
        <button class="cta-btn" onclick="window.location.reload()">Play Again</button>
      `;
      DOM.overlay.style.display = 'flex';
    }, 1200);
  }
</script>

</body>
</html>
