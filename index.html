<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitQuest: Active RPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    :root {
      --primary: #00ff66;
      --danger: #ff3333;
      --bg: #0d0e12;
      --panel: rgba(22, 24, 33, 0.85);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #161821 0%, #0d0e12 100%);
      overflow: hidden;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 14, 18, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #00b347 100%);
      border: none;
      color: #000;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 255, 102, 0.4);
    }

    .sprite {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 12px;
      will-change: transform, left, top;
    }

    #player {
      background: linear-gradient(135deg, var(--primary) 0%, #00a3cc 100%);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
    }

    #enemy {
      background: linear-gradient(135deg, var(--danger) 0%, #990000 100%);
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
    }

    .attack-bounce { animation: attackMelee 0.25s ease-out; }
    .damage-flash { animation: flashRed 0.15s ease-in-out 2; }

    @keyframes attackMelee {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    @keyframes flashRed {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.4; filter: brightness(2); }
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 10;
    }

    .top-hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .health-container { width: 42%; }

    .health-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: #aaa;
    }

    .health-bar-outer {
      width: 100%;
      height: 14px;
      background: #222;
      border-radius: 7px;
      overflow: hidden;
    }

    .health-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }

    #player-hp-fill { background: linear-gradient(90deg, #00ff66, #00bcff); }
    #enemy-hp-fill { background: linear-gradient(90deg, #ff3333, #ff8800); }

    .bottom-hud {
      width: 100%;
      text-align: center;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px;
    }

    #combat-log {
      height: 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #00e5ff;
    }

    /* Steerable Directional Joystick */
    #joystick-zone {
      position: absolute;
      bottom: 120px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #joystick-handle {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }

    #screen-log {
      position: absolute;
      top: 80px;
      left: 20px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #444;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="overlay">
    <h1 style="letter-spacing: 2px; color: var(--primary);">FitQuest</h1>
    <p style="color: #8a8f9d; margin-bottom: 30px; max-width: 280px; font-size: 0.95rem;">
      <b>Aim the controller</b> to choose your direction, then <b>move/walk in place</b> to run there! Shake your phone to strike!
    </p>
    <button class="cta-btn" onclick="initializeGame()">START ENGINE</button>
  </div>

  <div id="screen-log"></div>

  <div id="player" class="sprite"></div>
  <div id="enemy" class="sprite"></div>

  <div id="joystick-zone">
    <div id="joystick-handle"></div>
  </div>

  <div id="ui-layer">
    <div class="top-hud">
      <div class="health-container">
        <div class="health-label">Hero HP</div>
        <div class="health-bar-outer"><div id="player-hp-fill" class="health-bar-inner"></div></div>
      </div>
      <div class="health-container" style="text-align: right;">
        <div class="health-label">Boss HP</div>
        <div class="health-bar-outer"><div id="enemy-hp-fill" class="health-bar-inner"></div></div>
      </div>
    </div>

    <div class="bottom-hud">
      <div id="combat-log">Steer & move to explore...</div>
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    moveThreshold: 12.0,      // Accelerometer break limit to detect dynamic stepping/cycling
    shakeThreshold: 24.0,     // High spike window to track a sword slash strike
    attackCooldown: 500,
    attackRange: 75,
    maxSpeed: 7,
    friction: 0.88,          // Natural glide-deceleration when physics motion stops
    joystickRadius: 55
  };

  let state = {
    playerX: 0, playerY: 0,
    enemyX: 0, enemyY: 0,
    dirX: 0, dirY: 1,         // Direction vectors (Defaults facing rightwards)
    playerVelocity: 0,        // Unified speed scale generated from physical movement
    playerHP: 100, enemyHP: 100,
    lastAttackTime: 0,
    isGameOver: false,
    joystickActive: false
  };

  const DOM = {
    overlay: document.getElementById('overlay'),
    player: document.getElementById('player'),
    enemy: document.getElementById('enemy'),
    playerHPFill: document.getElementById('player-hp-fill'),
    enemyHPFill: document.getElementById('enemy-hp-fill'),
    combatLog: document.getElementById('combat-log'),
    joystickZone: document.getElementById('joystick-zone'),
    joystickHandle: document.getElementById('joystick-handle'),
    debug: document.getElementById('screen-log')
  };

  function initializeGame() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(response => { setupEngine(); })
        .catch(() => setupEngine());
    } else {
      setupEngine();
    }
  }

  function setupEngine() {
    DOM.overlay.style.display = 'none';
    
    // Position Spawn Setup
    state.playerX = window.innerWidth * 0.2;
    state.playerY = window.innerHeight * 0.5 - 30;
    state.enemyX = window.innerWidth * 0.75;
    state.enemyY = window.innerHeight * 0.5 - 30;
    
    updateSpritePositions();

    window.addEventListener('devicemotion', processMotion, false);
    setupJoystick();
    
    // Keyboard Support Fallback for Desktop Dev Environment (WASD or Arrows)
    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    requestAnimationFrame(gameLoop);
  }

  // Joystick Processing Setup
  function setupJoystick() {
    const zone = DOM.joystickZone;
    const handle = DOM.joystickHandle;
    const center = { x: CONFIG.joystickRadius, y: CONFIG.joystickRadius };

    function handleMove(e) {
      if (!state.joystickActive) return;
      let touch = e.touches ? e.touches[0] : e;
      let rect = zone.getBoundingClientRect();
      
      let deltaX = touch.clientX - (rect.left + center.x);
      let deltaY = touch.clientY - (rect.top + center.y);
      let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      
      if (distance > 0) {
        // Normalize the vector pointing path direction
        state.dirX = deltaX / distance;
        state.dirY = deltaY / distance;
      }

      // Handle clamp aesthetics visually
      if (distance > CONFIG.joystickRadius) {
        deltaX = state.dirX * CONFIG.joystickRadius;
        deltaY = state.dirY * CONFIG.joystickRadius;
      }

      handle.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      handle.style.borderColor = "var(--primary)";
      
      // Accessibility feature: holding joystick down completely also generates minor forward crawl speed
      if (distance > 10) {
        state.playerVelocity = Math.max(state.playerVelocity, (distance / CONFIG.joystickRadius) * 2);
      }
    }

    function handleEnd() {
      state.joystickActive = false;
      handle.style.transform = `translate(0px, 0px)`;
      handle.style.borderColor = "rgba(255, 255, 255, 0.6)";
    }

    zone.addEventListener('touchstart', (e) => { state.joystickActive = true; handleMove(e); }, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    zone.addEventListener('mousedown', (e) => { state.joystickActive = true; handleMove(e); });
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
  }

  // Combined Motion tracking processor
  function processMotion(event) {
    if (state.isGameOver) return;
    let acc = event.accelerationIncludingGravity;
    if (!acc) return;

    let totalForce = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);
    DOM.debug.innerHTML = `PHYSICAL ENERGY SENSOR: ${totalForce.toFixed(2)}`;

    // If body movement energy breaches threshold (User steps, spins, runs or circles in place)
    if (totalForce > CONFIG.moveThreshold) {
      // Inject energy velocity into whichever direction vector the controller is currently pointing
      state.playerVelocity = Math.min(state.playerVelocity + 0.8, CONFIG.maxSpeed);
    }

    // Secondary threshold pipeline for executing attacks via structural device shaking
    if (totalForce > CONFIG.shakeThreshold) {
      attemptAttack();
    }
  }

  // Keyboard controls translation map for manual desktop test profiles
  let keys = {};
  function handleKeyDown(e) {
    keys[e.code] = true;
    let kX = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
    let kY = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);
    
    if (kX !== 0 || kY !== 0) {
      let len = Math.sqrt(kX*kX + kY*kY);
      state.dirX = kX / len;
      state.dirY = kY / len;
      state.playerVelocity = Math.min(state.playerVelocity + 1.5, CONFIG.maxSpeed); // Simulate stepping input
    }
    if (e.code === 'Space') attemptAttack();
  }
  function handleKeyUp(e) { keys[e.code] = false; }

  // Game Render and Calculations Logic Loop
  function gameLoop() {
    if (state.isGameOver) return;

    // Apply friction to slow down cleanly when step input cuts out
    state.playerVelocity *= CONFIG.friction;
    if (state.playerVelocity < 0.05) state.playerVelocity = 0;

    // Displace player coordinates using combined: [Velocity Scalar] x [Joystick Direction Angle Units]
    state.playerX += state.dirX * state.playerVelocity;
    state.playerY += state.dirY * state.playerVelocity;

    // Canvas boundary safety collision calculations
    state.playerX = Math.max(0, Math.min(window.innerWidth - 60, state.playerX));
    state.playerY = Math.max(0, Math.min(window.innerHeight - 60, state.playerY));

    updateSpritePositions();
    requestAnimationFrame(gameLoop);
  }

  function attemptAttack() {
    if (state.isGameOver) return;
    let now = Date.now();
    if (now - state.lastAttackTime < CONFIG.attackCooldown) return;
    state.lastAttackTime = now;

    let dist = Math.sqrt(((state.enemyX+30) - (state.playerX+30))**2 + ((state.enemyY+30) - (state.playerY+30))**2);

    if (dist <= CONFIG.attackRange + 40) {
      DOM.player.classList.remove('attack-bounce');
      void DOM.player.offsetWidth;
      DOM.player.classList.add('attack-bounce');

      state.enemyHP = Math.max(state.enemyHP - 20, 0);
      DOM.enemyHPFill.style.width = `${state.enemyHP}%`;
      
      DOM.enemy.classList.remove('damage-flash');
      void DOM.enemy.offsetWidth;
      DOM.enemy.classList.add('damage-flash');

      DOM.combatLog.textContent = `💥 Enemy Smashed! Boss Health: ${state.enemyHP}%`;
      DOM.combatLog.style.color = "var(--primary)";

      if (state.enemyHP <= 0) endGame();
    } else {
      DOM.combatLog.textContent = "❌ Out of range! Point stick at boss and run closer.";
      DOM.combatLog.style.color = "#ffaa00";
    }
  }

  function updateSpritePositions() {
    DOM.player.style.left = `${state.playerX}px`;
    DOM.player.style.top = `${state.playerY}px`;
    DOM.enemy.style.left = `${state.enemyX}px`;
    DOM.enemy.style.top = `${state.enemyY}px`;
  }

  function endGame() {
    state.isGameOver = true;
    DOM.combatLog.textContent = "🏆 DUNGEON CLEAR!";
    setTimeout(() => {
      DOM.overlay.innerHTML = `
        <h1 style="color: var(--primary)">QUEST CLEAR!</h1>
        <button class="cta-btn" onclick="window.location.reload()">PLAY AGAIN</button>
      `;
      DOM.overlay.style.display = 'flex';
    }, 1200);
  }
</script>

</body>
</html>
