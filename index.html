<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitQuest: Pixel RPG Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    :root {
      --primary: #00ff66;
      --danger: #ff3333;
      --bg: #0d0e12;
      --panel: rgba(22, 24, 33, 0.9);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #181b26 0%, #08090d 100%);
      overflow: hidden;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 11, 15, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #00b347 100%);
      border: none;
      color: #000;
      padding: 16px 45px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 255, 102, 0.4);
    }

    /* --- THE SPRITE SHEET ENGINE ANIMATION CSS --- */
    .sprite {
      position: absolute;
      /* The bounding viewport box showing exactly one frame at a time */
      width: 64px; 
      height: 64px; 
      will-change: left, top;
    }

    #player {
      /* Dynamic direct link to a standard 4x3 character grid asset sheet */
      background-image: url('https://files.catbox.moe/gcl236.png'); 
      background-repeat: no-repeat;
      
      /* Scale the sheet cleanly to match a grid layout: 3 columns wide (192px), 4 rows tall (256px) */
      background-size: 192px 256px; 
      background-position: 0px 0px; 
      
      /* CRITICAL FOR RETRO RPG PIXEL ART: Stops mobile browsers from blurring tiny image scales */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #enemy {
      background: linear-gradient(135deg, var(--danger) 0%, #800000 100%);
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(255, 51, 51, 0.6);
    }

    /* Attack & Hurt Feedbacks */
    .attack-pulse { animation: hitPulse 0.2s ease-out; }
    .hurt-flash { animation: redFlash 0.15s ease-in-out 2; }

    @keyframes hitPulse {
      50% { transform: scale(1.3); filter: brightness(1.4); }
    }
    @keyframes redFlash {
      50% { opacity: 0.3; filter: brightness(2.5); }
    }

    /* UI Layout Overlays */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px;
      z-index: 10;
    }

    .top-bar { display: flex; justify-content: space-between; width: 100%; }
    .hp-housing { width: 40%; }
    .hp-label { font-size: 0.75rem; text-transform: uppercase; margin-bottom: 6px; color: #8f94a6; }
    .hp-track { width: 100%; height: 12px; background: #1f222e; border-radius: 6px; overflow: hidden; }
    .hp-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
    #p-fill { background: linear-gradient(90deg, #00ff66, #00bcff); }
    #e-fill { background: linear-gradient(90deg, #ff3333, #ffaa00); }

    .control-deck {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    #status-msg { font-size: 1.05rem; font-weight: bold; color: #00e5ff; margin-bottom: 4px; height: 24px; }
    .exercise-metrics { font-size: 0.8rem; color: #6c7285; text-transform: uppercase; }

    #joy-boundary {
      position: absolute;
      bottom: 140px;
      left: 35px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #joy-stick {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="overlay">
    <h1>PIXEL QUEST ARENA</h1>
    <p style="color: #7e8494; margin-bottom: 35px; max-width: 290px; font-size: 0.95rem; line-height: 1.5;">
      Aim with the joystick and jog in place to animate and move your pixel hero!
    </p>
    <button class="cta-btn" onclick="igniteEngine()">START EXERCISE</button>
  </div>

  <div id="player" class="sprite"></div>
  <div id="enemy" class="sprite"></div>

  <div id="joy-boundary">
    <div id="joy-stick"></div>
  </div>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="hp-housing">
        <div class="hp-label">Hero Energy</div>
        <div class="hp-track"><div id="p-fill" class="hp-fill"></div></div>
      </div>
      <div class="hp-housing" style="text-align: right;">
        <div class="hp-label">Target Boss</div>
        <div class="hp-track"><div id="e-fill" class="hp-fill"></div></div>
      </div>
    </div>

    <div class="control-deck">
      <div id="status-msg">Standby...</div>
      <div class="exercise-metrics" id="motion-display">Step Power: 0.00 | Status: Idle</div>
    </div>
  </div>
</div>

<script>
  const SETTINGS = {
    moveCutoff: 11.8,
    shakeCutoff: 23.5,
    combatWindow: 500,
    hitBoxRange: 75,
    frictionFactor: 0.88,
    accelerationGain: 0.7,
    velocityCap: 6.0,
    padRadius: 60,
    // Frame Rates Config
    spriteSize: 64,         // Dimension of one frame bounding box square (pixels)
    animationSpeed: 120     // Milliseconds elapsed before switching to the next step drawing
  };

  let runtime = {
    pX: 0, pY: 0, eX: 0, eY: 0,
    steerX: 0, steerY: 0,
    currentSpeed: 0,
    pHP: 100, eHP: 100,
    lastAttack: 0, halted: false, padActive: false,
    // Animation Engine Tickers
    currentFrameIndex: 0,   // Loop values: 0, 1, 2, or 1
    currentDirectionRow: 0, // Sprite Sheet map: 0 = Down, 1 = Left, 2 = Right, 3 = Up
    lastFrameUpdateTime: 0
  };

  const UI = {
    overlay: document.getElementById('overlay'),
    player: document.getElementById('player'),
    enemy: document.getElementById('enemy'),
    pFill: document.getElementById('p-fill'),
    eFill: document.getElementById('e-fill'),
    status: document.getElementById('status-msg'),
    motionInfo: document.getElementById('motion-display'),
    padBoundary: document.getElementById('joy-boundary'),
    padStick: document.getElementById('joy-stick')
  };

  function igniteEngine() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(setupEnvironment).catch(setupEnvironment);
    } else {
      setupEnvironment();
    }
  }

  function setupEnvironment() {
    UI.overlay.style.display = 'none';
    runtime.pX = window.innerWidth * 0.2;
    runtime.pY = window.innerHeight / 2 - 32;
    runtime.eX = window.innerWidth * 0.75;
    runtime.eY = window.innerHeight / 2 - 32;
    
    refreshViewportLayouts();
    window.addEventListener('devicemotion', evaluateDeviceSensors, false);
    buildJoystickControl();

    // Keyboards hooks
    window.addEventListener('keydown', simulateHardwareDown);
    window.addEventListener('keyup', simulateHardwareUp);

    requestAnimationFrame(engineFrameTick);
  }

  function buildJoystickControl() {
    const bound = UI.padBoundary;
    const stick = UI.padStick;

    function trackInput(e) {
      if (!runtime.padActive) return;
      let targetTouch = e.touches ? e.touches[0] : e;
      let geoBox = bound.getBoundingClientRect();
      
      let xOffset = targetTouch.clientX - (geoBox.left + SETTINGS.padRadius);
      let yOffset = targetTouch.clientY - (geoBox.top + SETTINGS.padRadius);
      let absoluteLength = Math.sqrt(xOffset * xOffset + yOffset * yOffset);

      if (absoluteLength > SETTINGS.padRadius) {
        xOffset = (xOffset / absoluteLength) * SETTINGS.padRadius;
        yOffset = (yOffset / absoluteLength) * SETTINGS.padRadius;
      }

      stick.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      runtime.steerX = xOffset / SETTINGS.padRadius;
      runtime.steerY = yOffset / SETTINGS.padRadius;

      // DYNAMIC SPRITE SHEET ROW PICKER
      // Select row matching movement direction vector weights
      if (Math.abs(runtime.steerX) > Math.abs(runtime.steerY)) {
        runtime.currentDirectionRow = runtime.steerX > 0 ? 2 : 1; // Row 2 = Right, Row 1 = Left
      } else {
        runtime.currentDirectionRow = runtime.steerY > 0 ? 0 : 3; // Row 0 = Down, Row 3 = Up
      }
    }

    function severInput() {
      runtime.padActive = false;
      stick.style.transform = `translate(0px, 0px)`;
      runtime.steerX = 0; runtime.steerY = 0;
    }

    bound.addEventListener('touchstart', (e) => { runtime.padActive = true; trackInput(e); }, {passive: false});
    window.addEventListener('touchmove', trackInput, {passive: false});
    window.addEventListener('touchend', severInput);
    bound.addEventListener('mousedown', (e) => { runtime.padActive = true; trackInput(e); });
    window.addEventListener('mousemove', trackInput);
    window.addEventListener('mouseup', severInput);
  }

  function evaluateDeviceSensors(event) {
    if (runtime.halted) return;
    let sensors = event.accelerationIncludingGravity;
    if (!sensors) return;

    let totalMagnitude = Math.sqrt((sensors.x||0)**2 + (sensors.y||0)**2 + (sensors.z||0)**2);

    if (totalMagnitude > SETTINGS.moveCutoff) {
      let workYield = (totalMagnitude - SETTINGS.moveCutoff) * SETTINGS.accelerationGain;
      runtime.currentSpeed = Math.min(runtime.currentSpeed + workYield, SETTINGS.velocityCap);
      UI.motionInfo.textContent = `Step Power: ${totalMagnitude.toFixed(1)} | Status: Walking!`;
    }

    if (totalMagnitude > SETTINGS.shakeCutoff) processCombatStrike();
  }

  // Continuous Frame Logic Processor Loop
  function engineFrameTick(timestamp) {
    if (runtime.halted) return;

    runtime.currentSpeed *= SETTINGS.frictionFactor;

    if (runtime.currentSpeed < 0.1) {
      runtime.currentSpeed = 0;
      UI.motionInfo.textContent = "Status: Idle (Exercise to walk)";
      // Reset character to standing still (Middle Column frame = index 1)
      runtime.currentFrameIndex = 1;
    } else {
      // HANDLE PIXEL STEP IMAGE SWAPPING LOGIC ACCORDING TO VELOCITY PUMP RATES
      if (timestamp - runtime.lastFrameUpdateTime > SETTINGS.animationSpeed) {
        runtime.lastFrameUpdateTime = timestamp;
        
        // This advances the drawing column sequence from left to right across the sheet
        runtime.currentFrameIndex = (runtime.currentFrameIndex + 1) % 3;
      }
    }

    runtime.pX += runtime.steerX * runtime.currentSpeed;
    runtime.pY += runtime.steerY * runtime.currentSpeed;

    runtime.pX = Math.max(0, Math.min(window.innerWidth - 64, runtime.pX));
    runtime.pY = Math.max(0, Math.min(window.innerHeight - 64, runtime.pY));

    refreshViewportLayouts();
    requestAnimationFrame(engineFrameTick);
  }

  function refreshViewportLayouts() {
    UI.player.style.left = `${runtime.pX}px`;
    UI.player.style.top = `${runtime.pY}px`;
    UI.enemy.style.left = `${runtime.eX}px`;
    UI.enemy.style.top = `${runtime.eY}px`;

    // --- SPRITE POSITION CALCULATIONS MAPS ---
    // Slide the coordinates background view window around the master png grid asset sheet
    let xPixelShift = runtime.currentFrameIndex * SETTINGS.spriteSize;
    let yPixelShift = runtime.currentDirectionRow * SETTINGS.spriteSize;
    
    UI.player.style.backgroundPosition = `-${xPixelShift}px -${yPixelShift}px`;
  }

  // Keyboard fallbacks simulator
  let testKeys = {};
  function simulateHardwareDown(e) {
    testKeys[e.code] = true;
    if (e.code === 'ShiftLeft' || e.code === 'Space') runtime.currentSpeed = Math.min(runtime.currentSpeed + 2.0, SETTINGS.velocityCap);
    if (e.code === 'KeyE') processCombatStrike();
    mapSimulatedSteering();
  }
  function simulateHardwareUp(e) { testKeys[e.code] = false; mapSimulatedSteering(); }
  function mapSimulatedSteering() {
    if (runtime.padActive) return;
    runtime.steerX = (testKeys['KeyD'] || testKeys['ArrowRight'] ? 1 : 0) - (testKeys['KeyA'] || testKeys['ArrowLeft'] ? 1 : 0);
    runtime.steerY = (testKeys['KeyS'] || testKeys['ArrowDown'] ? 1 : 0) - (testKeys['KeyW'] || testKeys['ArrowUp'] ? 1 : 0);
    if (runtime.steerX !== 0 || runtime.steerY !== 0) {
      if (Math.abs(runtime.steerX) > Math.abs(runtime.steerY)) runtime.currentDirectionRow = runtime.steerX > 0 ? 2 : 1;
      else runtime.currentDirectionRow = runtime.steerY > 0 ? 0 : 3;
    }
  }

  function processCombatStrike() {
    if (runtime.halted) return;
    let timeStamp = Date.now();
    if (timeStamp - runtime.lastAttack < SETTINGS.combatWindow) return;
    runtime.lastAttack = timeStamp;

    let distanceVector = Math.sqrt(((runtime.eX + 32) - (runtime.pX + 32))**2 + ((runtime.eY + 32) - (runtime.pY + 32))**2);
    if (distanceVector <= SETTINGS.hitBoxRange + 40) {
      UI.player.classList.remove('attack-pulse'); void UI.player.offsetWidth; UI.player.classList.add('attack-pulse');
      runtime.eHP = Math.max(runtime.eHP - 20, 0); UI.eFill.style.width = `${runtime.eHP}%`;
      UI.enemy.classList.remove('hurt-flash'); void UI.enemy.offsetWidth; UI.enemy.classList.add('hurt-flash');
      UI.status.textContent = `💥 Smacked Boss! Enemy HP: ${runtime.eHP}%`;
      if (runtime.eHP <= 0) { runtime.halted = true; UI.status.textContent = "🏆 QUEST COMPLETED!"; }
    } else {
      UI.status.textContent = "❌ Out of range! Get closer!";
    }
  }
</script>

</body>
</html>
