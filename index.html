<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitQuest: Arena Battle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    :root {
      --primary: #00ff66;
      --danger: #ff3333;
      --bg: #090a0f;
      --panel: rgba(18, 20, 28, 0.9);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-stack);
      background: var(--bg);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1c1f2e 0%, #090a0f 100%);
      overflow: hidden;
    }

    /* Screen State Overlays */
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 15, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #00b347 100%);
      border: none;
      color: #000;
      padding: 16px 45px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 255, 102, 0.35);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Entities Layout */
    .sprite {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      left: 0;
      top: 0;
      will-change: transform;
    }

    #player {
      background: linear-gradient(135deg, var(--primary) 0%, #00bcff 100%);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
    }

    #enemy {
      background: linear-gradient(135deg, var(--danger) 0%, #730000 100%);
      box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
    }

    /* Projectiles */
    .projectile {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ffaa00;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff3333;
      left: 0;
      top: 0;
      will-change: transform;
    }

    /* Combat Animations Matrix */
    .melee-strike { animation: meleeMotion 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .take-damage { animation: damageFlash 0.12s ease-in-out 3; }

    @keyframes meleeMotion {
      0% { transform: scale(1) translate(0, 0); }
      40% { transform: scale(1.25) translate(15px, -10px); filter: brightness(1.3); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes damageFlash {
      50% { opacity: 0.2; transform: scale(0.9); filter: saturate(2) brightness(3); }
    }

    /* Heads-Up Display UI Map */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px;
      z-index: 10;
    }

    .top-hud { display: flex; justify-content: space-between; width: 100%; }
    .hud-card { width: 42%; }

    .bar-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #8e95a5;
      font-weight: 600;
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: #191b24;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .bar-fill { height: 100%; width: 100%; transition: width 0.2s cubic-bezier(0.1, 0.8, 0.2, 1); }
    #p-hp-fill { background: linear-gradient(90deg, #00ff66, #00d4ff); }
    #e-hp-fill { background: linear-gradient(90deg, #ff3333, #ff9900); }

    .bottom-deck {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #combat-feed {
      font-size: 1.05rem;
      font-weight: 700;
      color: #00e5ff;
      margin-bottom: 4px;
      height: 24px;
    }

    .telemetry-subtext {
      font-size: 0.8rem;
      color: #696f7d;
      font-weight: 500;
    }

    /* Joystick Track Interface */
    #joy-container {
      position: absolute;
      bottom: 150px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.02);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #joy-knob {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
    }

    #monitor-panel {
      position: absolute;
      top: 90px;
      left: 25px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #494d5a;
      pointer-events: none;
      text-align: left;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="overlay" class="screen-overlay">
    <h1 style="font-size: 2.2rem; letter-spacing: 3px; margin: 0 0 10px 0; color: var(--primary);">FITQUEST PRO</h1>
    <p style="color: #798092; margin-bottom: 35px; max-width: 300px; font-size: 0.95rem; line-height: 1.6;">
      Aim with the <b>Joystick</b>.<br>
      <span style="color: #fff; font-weight: 600;">Step or Jog in place to generate speed.</span><br>
      The Boss is stationary but fires back! Avoid projectiles and shake to attack.
    </p>
    <button class="cta-btn" onclick="requestHardwarePermissions()">Start Session</button>
  </div>

  <div id="monitor-panel"></div>

  <div id="player" class="sprite"></div>
  <div id="enemy" class="sprite"></div>

  <div id="joy-container">
    <div id="joy-knob"></div>
  </div>

  <div id="ui-layer">
    <div class="top-hud">
      <div class="hud-card">
        <div class="bar-label">Your Vitals</div>
        <div class="bar-track"><div id="p-hp-fill" class="bar-fill"></div></div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="bar-label">Stationary Boss</div>
        <div class="bar-track"><div id="e-hp-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div class="bottom-deck">
      <div id="combat-feed">System Live</div>
      <div class="telemetry-subtext" id="engine-status">Cadence Vector: 0.00 Hz | Output: Stationary</div>
    </div>
  </div>
</div>

<script>
  const ENGINE_CONFIG = {
    lowPassFilterFactor: 0.18,   
    motionStepFloor: 1.6,       
    combatShakeFloor: 14.5,     
    attackInterval: 450,        
    
    momentumDecay: 4.8,         
    kineticInputGain: 12.5,     
    velocityCeiling: 320.0,     
    combatContactZone: 90.0,    
    joystickRadius: 55,

    // Projectile Balancing Systems
    bossAttackCooldown: 2200,   // Fireball frequency rate (ms)
    fireballSpeed: 210.0         // Velocity pixels per second
  };

  let runtime = {
    pX: 0, pY: 0,
    eX: 0, eY: 0,
    pVx: 0, pVy: 0,             
    lastFrameTime: 0,
    isHalted: false,
    joystickTracking: false,
    isDesktopFallback: false,    
    
    aimVectorX: 0, aimVectorY: 0,
    
    smoothedX: 0, smoothedY: 0, smoothedZ: 0,
    lastStepTimestamp: 0,
    cadenceFrequency: 0.0,      
    
    pHero: 100, eBoss: 100,
    lastCombatExecution: 0,
    lastBossAttackTime: 0,
    
    projectiles: [] // Active bullets tracking stack array
  };

  const DOM = {
    container: document.getElementById('game-container'),
    overlay: document.getElementById('overlay'),
    player: document.getElementById('player'),
    enemy: document.getElementById('enemy'),
    pHP: document.getElementById('p-hp-fill'),
    eHP: document.getElementById('e-hp-fill'),
    feed: document.getElementById('combat-feed'),
    metrics: document.getElementById('engine-status'),
    joyZone: document.getElementById('joy-container'),
    joyKnob: document.getElementById('joy-knob'),
    diagnostic: document.getElementById('monitor-panel')
  };

  function requestHardwarePermissions() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') bootEngineCore();
          else fallbackToSimulatorMode("Sensor permission denied.");
        })
        .catch(() => fallbackToSimulatorMode("Sensor handshake error."));
    } else {
      if (navigator.userAgent.match(/Android|iPhone|iPad|iPod/i)) {
        fallbackToSimulatorMode("Sensors missing on device hardware configuration.");
      } else {
        runtime.isDesktopFallback = true;
        bootEngineCore();
      }
    }
  }

  function fallbackToSimulatorMode(reason) {
    runtime.isDesktopFallback = true;
    bootEngineCore();
  }

  function bootEngineCore() {
    DOM.overlay.style.display = 'none';
    
    // Fixed layout mapping positions (Boss locked completely to the center right)
    runtime.pX = window.innerWidth * 0.15;
    runtime.pY = window.innerHeight * 0.5 - 32;
    runtime.eX = window.innerWidth - 120;
    runtime.eY = window.innerHeight * 0.5 - 32;
    
    if (!runtime.isDesktopFallback) {
      window.addEventListener('devicemotion', processSensorSignal, { passive: false });
    } else {
      setupDesktopSimulatorHooks();
    }
    
    bindJoystickInterface();
    
    runtime.lastFrameTime = performance.now();
    runtime.lastBossAttackTime = performance.now();
    requestAnimationFrame(gameEngineTick);
  }

  function processSensorSignal(event) {
    if (runtime.isHalted) return;
    
    let rawAccel = event.acceleration; 
    if (!rawAccel || rawAccel.x === null) {
      rawAccel = event.accelerationIncludingGravity; 
      if (!rawAccel) return;
    }

    let alpha = ENGINE_CONFIG.lowPassFilterFactor;
    runtime.smoothedX = runtime.smoothedX + alpha * ((rawAccel.x || 0) - runtime.smoothedX);
    runtime.smoothedY = runtime.smoothedY + alpha * ((rawAccel.y || 0) - runtime.smoothedY);
    runtime.smoothedZ = runtime.smoothedZ + alpha * ((rawAccel.z || 0) - runtime.smoothedZ);

    let currentNetMagnitude = Math.sqrt(runtime.smoothedX**2 + runtime.smoothedY**2 + runtime.smoothedZ**2);
    let rawJerkDelta = Math.abs(currentNetMagnitude - (runtime.lastCalculatedMag || 0));
    runtime.lastCalculatedMag = currentNetMagnitude;

    DOM.diagnostic.innerHTML = `RAW MAG: ${currentNetMagnitude.toFixed(2)}G<br>JERK DELTA: ${rawJerkDelta.toFixed(2)}<br>MODE: MOBILE HARDWARE`;

    if (currentNetMagnitude > ENGINE_CONFIG.motionStepFloor) {
      let currentTime = performance.now();
      let stepTimeDelta = currentTime - runtime.lastStepTimestamp;

      if (stepTimeDelta > 250 && stepTimeDelta < 2000) {
        runtime.cadenceFrequency = 1000 / stepTimeDelta; 
        let propulsionPower = ENGINE_CONFIG.kineticInputGain * (currentNetMagnitude);
        runtime.pVx += runtime.aimVectorX * propulsionPower;
        runtime.pVy += runtime.aimVectorY * propulsionPower;
      }
      runtime.lastStepTimestamp = currentTime;
    }

    if (rawJerkDelta > ENGINE_CONFIG.combatShakeFloor) {
      evaluateCombatInteraction();
    }
  }

  function bindJoystickInterface() {
    const boundaryNode = DOM.joyZone;
    const knobNode = DOM.joyKnob;
    const r = ENGINE_CONFIG.joystickRadius;

    function evaluateInputVector(clientX, clientY) {
      let zoneRect = boundaryNode.getBoundingClientRect();
      let originX = zoneRect.left + r;
      let originY = zoneRect.top + r;

      let dX = clientX - originX;
      let dY = clientY - originY;
      let hypotenuseLength = Math.sqrt(dX * dX + dY * dY);

      if (hypotenuseLength > r) {
        dX = (dX / hypotenuseLength) * r;
        dY = (dY / hypotenuseLength) * r;
        hypotenuseLength = r;
      }

      knobNode.style.transform = `translate3d(${dX}px, ${dY}px, 0px)`;
      knobNode.style.borderColor = "var(--primary)";

      runtime.aimVectorX = hypotenuseLength > 0 ? dX / r : 0;
      runtime.aimVectorY = hypotenuseLength > 0 ? dY / r : 0;
    }

    function breakTracking() {
      runtime.joystickTracking = false;
      knobNode.style.transform = `translate3d(0px, 0px, 0px)`;
      knobNode.style.borderColor = "rgba(255, 255, 255, 0.7)";
      runtime.aimVectorX = 0;
      runtime.aimVectorY = 0;
    }

    boundaryNode.addEventListener('touchstart', (e) => { runtime.joystickTracking = true; evaluateInputVector(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (runtime.joystickTracking) { evaluateInputVector(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
    window.addEventListener('touchend', breakTracking);

    boundaryNode.addEventListener('mousedown', (e) => { runtime.joystickTracking = true; evaluateInputVector(e.clientX, e.clientY); });
    window.addEventListener('mousemove', (e) => { if (runtime.joystickTracking) evaluateInputVector(e.clientX, e.clientY); });
    window.addEventListener('mouseup', breakTracking);
  }

  let virtualKeyArray = {};
  function setupDesktopSimulatorHooks() {
    window.addEventListener('keydown', (e) => { 
      virtualKeyArray[e.code] = true; 
      if (e.code === 'Space') evaluateCombatInteraction();
      processKeyboardSteering();
    });
    window.addEventListener('keyup', (e) => { 
      virtualKeyArray[e.code] = false; 
      processKeyboardSteering();
    });
  }

  function processKeyboardSteering() {
    if (runtime.joystickTracking) return;
    runtime.aimVectorX = (virtualKeyArray['KeyD'] || virtualKeyArray['ArrowRight'] ? 1 : 0) - (virtualKeyArray['KeyA'] || virtualKeyArray['ArrowLeft'] ? 1 : 0);
    runtime.aimVectorY = (virtualKeyArray['KeyS'] || virtualKeyArray['ArrowDown'] ? 1 : 0) - (virtualKeyArray['KeyW'] || virtualKeyArray['ArrowUp'] ? 1 : 0);
    
    if (runtime.aimVectorX !== 0 && runtime.aimVectorY !== 0) {
      runtime.aimVectorX *= 0.7071;
      runtime.aimVectorY *= 0.7071;
    }
  }

  function processDesktopSimulatedPhysics(dt) {
    if (runtime.aimVectorX !== 0 || runtime.aimVectorY !== 0) {
      runtime.cadenceFrequency = 1.85;
      let simulatedEnergyUnit = 90.0 * dt;
      runtime.pVx += runtime.aimVectorX * simulatedEnergyUnit;
      runtime.pVy += runtime.aimVectorY * simulatedEnergyUnit;
    } else {
      runtime.cadenceFrequency = 0;
    }
    DOM.diagnostic.innerHTML = `MODE: DEV SIMULATOR DETECTED<br>WASD/ARROWS = STEER & RUN<br>SPACEBAR = COMBAT SHAKE`;
  }

  function evaluateCombatInteraction() {
    if (runtime.isHalted) return;
    let clockTicks = performance.now();
    
    if (clockTicks - runtime.lastCombatExecution < ENGINE_CONFIG.attackInterval) return;
    runtime.lastCombatExecution = clockTicks;

    let distanceToTarget = Math.sqrt(((runtime.eX + 32) - (runtime.pX + 32))**2 + ((runtime.eY + 32) - (runtime.pY + 32))**2);

    if (distanceToTarget <= ENGINE_CONFIG.combatContactZone) {
      executeValidatedMeleeStrike();
    } else {
      DOM.feed.textContent = "❌ Too far away! Jog into range near the right side!";
      DOM.feed.style.color = "#ffaa00";
    }
  }

  function executeValidatedMeleeStrike() {
    DOM.player.classList.remove('melee-strike');
    void DOM.player.offsetWidth; 
    DOM.player.classList.add('melee-strike');

    runtime.eBoss = Math.max(runtime.eBoss - 20, 0);
    DOM.eHP.style.width = `${runtime.eBoss}%`;

    DOM.enemy.classList.remove('take-damage');
    void DOM.enemy.offsetWidth;
    DOM.enemy.classList.add('take-damage');

    DOM.feed.textContent = `💥 Hit Boss! Target HP: ${runtime.eBoss}%`;
    DOM.feed.style.color = "var(--primary)";

    if (runtime.eBoss <= 0) declareEndGameState(true);
  }

  /**
   * PRO CONTEXT DELTA ENGINE RUN CLOCK
   */
  function gameEngineTick(currentFrameTimestamp) {
    if (runtime.isHalted) return;

    let deltaTime = (currentFrameTimestamp - runtime.lastFrameTime) / 1000;
    runtime.lastFrameTime = currentFrameTimestamp;

    if (deltaTime > 0.15) deltaTime = 0.15;

    if (runtime.isDesktopFallback) {
      processDesktopSimulatedPhysics(deltaTime);
    }

    // 1. Friction Dampening
    let absoluteVelocityMagnitude = Math.sqrt(runtime.pVx**2 + runtime.pVy**2);
    if (absoluteVelocityMagnitude > 0) {
      let dragReductionUnit = ENGINE_CONFIG.momentumDecay * deltaTime;
      if (absoluteVelocityMagnitude <= dragReductionUnit) {
        runtime.pVx = 0; runtime.pVy = 0;
      } else {
        runtime.pVx -= (runtime.pVx / absoluteVelocityMagnitude) * dragReductionUnit * absoluteVelocityMagnitude;
        runtime.pVy -= (runtime.pVy / absoluteVelocityMagnitude) * dragReductionUnit * absoluteVelocityMagnitude;
      }
    }

    // 2. Clamp Velocity
    let currentSpeedMetric = Math.sqrt(runtime.pVx**2 + runtime.pVy**2);
    if (currentSpeedMetric > ENGINE_CONFIG.velocityCeiling) {
      runtime.pVx = (runtime.pVx / currentSpeedMetric) * ENGINE_CONFIG.velocityCeiling;
      runtime.pVy = (runtime.pVy / currentSpeedMetric) * ENGINE_CONFIG.velocityCeiling;
    }

    // 3. Coordinate Update
    runtime.pX += runtime.pVx * deltaTime;
    runtime.pY += runtime.pVy * deltaTime;

    // 4. Boundary Protection
    runtime.pX = Math.max(0, Math.min(window.innerWidth - 64, runtime.pX));
    runtime.pY = Math.max(0, Math.min(window.innerHeight - 64, runtime.pY));

    // 5. Boss Ranged Combat Attack Triggers
    if (currentFrameTimestamp - runtime.lastBossAttackTime > ENGINE_CONFIG.bossAttackCooldown) {
      runtime.lastBossAttackTime = currentFrameTimestamp;
      spawnBossProjectile();
    }

    // 6. Projectiles Vector Update Pipeline
    processActiveProjectiles(deltaTime);

    // Render Transforms
    DOM.player.style.transform = `translate3d(${runtime.pX}px, ${runtime.pY}px, 0px)`;
    DOM.enemy.style.transform = `translate3d(${runtime.eX}px, ${runtime.eY}px, 0px)`;

    refreshHUDLogs();

    requestAnimationFrame(gameEngineTick);
  }

  /**
   * PROTEST SYSTEMS: PROJECTILE DISPATCH & HIT DETECTION
   */
  function spawnBossProjectile() {
    let bulletNode = document.createElement('div');
    bulletNode.className = 'projectile';
    DOM.container.appendChild(bulletNode);

    // Calculate heading direction angles targeting the current location of the player element
    let bOriginX = runtime.eX + 24;
    let bOriginY = runtime.eY + 24;
    let targetVecX = (runtime.pX + 32) - bOriginX;
    let targetVecY = (runtime.pY + 32) - bOriginY;
    let vectorDistance = Math.sqrt(targetVecX * targetVecX + targetVecY * targetVecY);

    let projObject = {
      dom: bulletNode,
      x: bOriginX,
      y: bOriginY,
      vX: (targetVecX / vectorDistance) * ENGINE_CONFIG.fireballSpeed,
      vY: (targetVecY / vectorDistance) * ENGINE_CONFIG.fireballSpeed
    };

    runtime.projectiles.push(projObject);
  }

  function processActiveProjectiles(dt) {
    for (let i = runtime.projectiles.length - 1; i >= 0; i--) {
      let b = runtime.projectiles[i];
      b.x += b.vX * dt;
      b.y += b.vY * dt;

      b.dom.style.transform = `translate3d(${b.x}px, ${b.y}px, 0px)`;

      // Boundary cleanup check to free up memory spaces
      if (b.x < -20 || b.x > window.innerWidth + 20 || b.y < -20 || b.y > window.innerHeight + 20) {
        b.dom.remove();
        runtime.projectiles.splice(i, 1);
        continue;
      }

      // Check collision with your player node
      let pCenterX = runtime.pX + 32;
      let pCenterY = runtime.pY + 32;
      let projectileDistance = Math.sqrt((pCenterX - (b.x + 8))**2 + (pCenterY - (b.y + 8))**2);

      if (projectileDistance < 36) {
        // Player takes a hit
        runtime.pHero = Math.max(runtime.pHero - 15, 0);
        DOM.pHP.style.width = `${runtime.pHero}%`;
        DOM.feed.textContent = "💥 Ouch! You were hit by a fireball! Keep moving!";
        DOM.feed.style.color = "var(--danger)";

        DOM.player.classList.remove('take-damage');
        void DOM.player.offsetWidth;
        DOM.player.classList.add('take-damage');

        // Delete bullet asset instance
        b.dom.remove();
        runtime.projectiles.splice(i, 1);

        if (runtime.pHero <= 0) declareEndGameState(false);
      }
    }
  }

  function refreshHUDLogs() {
    let scalarSpeedRepresentation = Math.sqrt(runtime.pVx**2 + runtime.pVy**2);
    if (scalarSpeedRepresentation > 5) {
      DOM.metrics.textContent = `Cadence Vector: ${runtime.cadenceFrequency.toFixed(1)} Hz | Velocity: ${Math.round(scalarSpeedRepresentation)} px/s`;
      DOM.metrics.style.color = "var(--primary)";
    } else {
      DOM.metrics.textContent = `Cadence Vector: 0.00 Hz | Output: Idle (Step to Move)`;
      DOM.metrics.style.color = "#696f7d";
    }
  }

  function declareEndGameState(victory) {
    runtime.isHalted = true;
    
    // Cleanup remaining bullet objects
    runtime.projectiles.forEach(b => b.dom.remove());
    runtime.projectiles = [];

    DOM.feed.textContent = victory ? "🏆 GOAL OBTAINED!" : "❌ DEFEATED!";
    DOM.feed.style.color = victory ? "var(--primary)" : "var(--danger)";
    
    setTimeout(() => {
      DOM.overlay.innerHTML = `
        <h1 style="color: ${victory ? 'var(--primary)' : 'var(--danger)'}; letter-spacing: 2px;">
          ${victory ? 'SESSION COMPLETED' : 'QUEST FAILED'}
        </h1>
        <p style="color: #8e95a5; margin-bottom: 25px; font-size:0.95rem;">
          ${victory ? 'Boss cleared successfully.' : 'Your vitals hit zero. Don\'t stop training!'}
        </p>
        <button class="cta-btn" onclick="window.location.reload()">Try Again</button>
      `;
      DOM.overlay.style.display = 'flex';
    }, 1200);
  }
</script>

</body>
</html>
