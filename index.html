<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitQuest: Cardio Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    :root {
      --primary: #00ff66;
      --danger: #ff3333;
      --bg: #0d0e12;
      --panel: rgba(22, 24, 33, 0.9);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Disables drag-to-scroll viewport breaks */
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #181b26 0%, #08090d 100%);
      overflow: hidden;
    }

    /* Screen Block Overlays */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 11, 15, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #00b347 100%);
      border: none;
      color: #000;
      padding: 16px 45px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 255, 102, 0.4);
    }

    /* Rendering Nodes */
    .sprite {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 14px;
      will-change: left, top, transform;
    }

    #player {
      background: linear-gradient(135deg, var(--primary) 0%, #00bcff 100%);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
    }

    #enemy {
      background: linear-gradient(135deg, var(--danger) 0%, #800000 100%);
      box-shadow: 0 0 25px rgba(255, 51, 51, 0.6);
    }

    /* Structural Feedback Frames */
    .attack-pulse { animation: hitPulse 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
    .hurt-flash { animation: redFlash 0.15s ease-in-out 2; }

    @keyframes hitPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    @keyframes redFlash {
      50% { opacity: 0.3; filter: brightness(2.5); }
    }

    /* Interface Containers */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px;
      z-index: 10;
    }

    .top-bar { display: flex; justify-content: space-between; width: 100%; }
    .hp-housing { width: 40%; }

    .hp-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #8f94a6;
    }

    .hp-track {
      width: 100%;
      height: 12px;
      background: #1f222e;
      border-radius: 6px;
      overflow: hidden;
    }

    .hp-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
    #p-fill { background: linear-gradient(90deg, #00ff66, #00bcff); }
    #e-fill { background: linear-gradient(90deg, #ff3333, #ffaa00); }

    .control-deck {
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #status-msg {
      font-size: 1.05rem;
      font-weight: bold;
      color: #00e5ff;
      margin-bottom: 4px;
      height: 24px;
    }

    .exercise-metrics {
      font-size: 0.8rem;
      color: #6c7285;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Analog Directional Joystick Pad */
    #joy-boundary {
      position: absolute;
      bottom: 140px;
      left: 35px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #joy-stick {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }

    #telemetry-monitor {
      position: absolute;
      top: 90px;
      left: 25px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #4a4d59;
      pointer-events: none;
      text-align: left;
      line-height: 1.3;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="overlay">
    <h1>FITQUEST ARENA</h1>
    <p style="color: #7e8494; margin-bottom: 35px; max-width: 290px; font-size: 0.95rem; line-height: 1.5;">
      Hold device and steer with the <b>Joystick</b>.<br><br>
      <span style="color: var(--primary)">🏃 Run or walk in place to move!</span><br>
      <span style="color: #00e5ff">⚔️ Shake fast to strike!</span>
    </p>
    <button class="cta-btn" onclick="igniteEngine()">START EXERCISE</button>
  </div>

  <div id="telemetry-monitor"></div>

  <div id="player" class="sprite"></div>
  <div id="enemy" class="sprite"></div>

  <div id="joy-boundary">
    <div id="joy-stick"></div>
  </div>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="hp-housing">
        <div class="hp-label">Player Energy</div>
        <div class="hp-track"><div id="p-fill" class="hp-fill"></div></div>
      </div>
      <div class="hp-housing" style="text-align: right;">
        <div class="hp-label">Target Boss</div>
        <div class="hp-track"><div id="e-fill" class="hp-fill"></div></div>
      </div>
    </div>

    <div class="control-deck">
      <div id="status-msg">Standby...</div>
      <div class="exercise-metrics" id="motion-display">Step Power: 0.00 | Engine Status: Idle</div>
    </div>
  </div>
</div>

<script>
  const SETTINGS = {
    moveCutoff: 11.8,       // Base acceleration threshold to detect stepping/jogging
    shakeCutoff: 23.5,      // Higher threshold spike for weapon attacks
    combatWindow: 500,      // Weapon swing speed cooldown delay (ms)
    hitBoxRange: 75,        // Pixels allowed between center coordinates for combat contact
    frictionFactor: 0.88,   // Dynamic slide dampening engine speed roll-off
    accelerationGain: 0.7,  // Velocity multiplier scale gained per step
    velocityCap: 7.5,       // Absolute speed velocity roof limit
    padRadius: 60           // Joystick tracking offset perimeter boundary
  };

  let runtime = {
    pX: 0, pY: 0,
    eX: 0, eY: 0,
    steerX: 0, steerY: 0,   // Controller structural angle outputs
    currentSpeed: 0,        // Regulated purely by physical workout forces
    pHP: 100, eHP: 100,
    lastAttack: 0,
    halted: false,
    padActive: false
  };

  const UI = {
    overlay: document.getElementById('overlay'),
    player: document.getElementById('player'),
    enemy: document.getElementById('enemy'),
    pFill: document.getElementById('p-fill'),
    eFill: document.getElementById('e-fill'),
    status: document.getElementById('status-msg'),
    motionInfo: document.getElementById('motion-display'),
    padBoundary: document.getElementById('joy-boundary'),
    padStick: document.getElementById('joy-stick'),
    telemetry: document.getElementById('telemetry-monitor')
  };

  function igniteEngine() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(res => { setupEnvironment(); })
        .catch(() => setupEnvironment());
    } else {
      setupEnvironment();
    }
  }

  function setupEnvironment() {
    UI.overlay.style.display = 'none';

    // Grid Layout Positioning Spawns
    runtime.pX = window.innerWidth * 0.15;
    runtime.pY = window.innerHeight / 2 - 30;
    runtime.eX = window.innerWidth * 0.75;
    runtime.eY = window.innerHeight / 2 - 30;

    refreshViewportLayouts();

    // Event Wire-up Connections
    window.addEventListener('devicemotion', evaluateDeviceSensors, false);
    buildJoystickControl();

    // Cross-Platform Fallback Simulator Hooks
    window.addEventListener('keydown', simulateHardwareDown);
    window.addEventListener('keyup', simulateHardwareUp);

    requestAnimationFrame(engineFrameTick);
  }

  // Dual-Axis Controller System
  function buildJoystickControl() {
    const bound = UI.padBoundary;
    const stick = UI.padStick;

    function trackInput(e) {
      if (!runtime.padActive) return;
      let targetTouch = e.touches ? e.touches[0] : e;
      let geoBox = bound.getBoundingClientRect();

      let xOffset = targetTouch.clientX - (geoBox.left + SETTINGS.padRadius);
      let yOffset = targetTouch.clientY - (geoBox.top + SETTINGS.padRadius);
      let absoluteLength = Math.sqrt(xOffset * xOffset + yOffset * yOffset);

      if (absoluteLength > SETTINGS.padRadius) {
        xOffset = (xOffset / absoluteLength) * SETTINGS.padRadius;
        yOffset = (yOffset / absoluteLength) * SETTINGS.padRadius;
      }

      stick.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      stick.style.borderColor = "var(--primary)";

      // Store normalized steering vectors (-1 to 1)
      // This tells us *where* to go, but does NOT move the player alone.
      runtime.steerX = xOffset / SETTINGS.padRadius;
      runtime.steerY = yOffset / SETTINGS.padRadius;
    }

    function severInput() {
      runtime.padActive = false;
      stick.style.transform = `translate(0px, 0px)`;
      stick.style.borderColor = "rgba(255, 255, 255, 0.8)";
      runtime.steerX = 0;
      runtime.steerY = 0;
    }

    bound.addEventListener('touchstart', (e) => { runtime.padActive = true; trackInput(e); }, {passive: false});
    window.addEventListener('touchmove', trackInput, {passive: false});
    window.addEventListener('touchend', severInput);

    bound.addEventListener('mousedown', (e) => { runtime.padActive = true; trackInput(e); });
    window.addEventListener('mousemove', trackInput);
    window.addEventListener('mouseup', severInput);
  }

  // Physical Motion Extraction Engine
  function evaluateDeviceSensors(event) {
    if (runtime.halted) return;
    let sensors = event.accelerationIncludingGravity;
    if (!sensors) return;

    let forceX = sensors.x || 0;
    let forceY = sensors.y || 0;
    let forceZ = sensors.z || 0;

    // Euclidean Vector Magnitude representing physical motion output intensity
    let totalMagnitude = Math.sqrt(forceX*forceX + forceY*forceY + forceZ*forceZ);

    UI.telemetry.innerHTML = `ACCEL NET: ${totalMagnitude.toFixed(2)}G<br>X: ${forceX.toFixed(1)} | Y: ${forceY.toFixed(1)} | Z: ${forceZ.toFixed(1)}`;

    // 1. Core Exercise Reader (The Gas Pedal)
    // Running in place, jumping, or looping patterns breaks this line ceiling
    if (totalMagnitude > SETTINGS.moveCutoff) {
      // Add speed proportional to your physical movement intensity
      let workYield = (totalMagnitude - SETTINGS.moveCutoff) * SETTINGS.accelerationGain;
      runtime.currentSpeed = Math.min(runtime.currentSpeed + workYield, SETTINGS.velocityCap);

      UI.motionInfo.textContent = `Step Power: ${totalMagnitude.toFixed(1)} | Status: Moving!`;
      UI.motionInfo.style.color = "var(--primary)";
    }

    // 2. Weapon Shake Attack Monitor
    if (totalMagnitude > SETTINGS.shakeCutoff) {
      processCombatStrike();
    }
  }

  // Keyboard Simulation Controls for Desktop Debug Testing
  let testKeys = {};
  function simulateHardwareDown(e) {
    testKeys[e.code] = true;
    if (e.code === 'ShiftLeft' || e.code === 'Space') {
      // Simulate taking a physical step or exercise surge manually via Shift
      runtime.currentSpeed = Math.min(runtime.currentSpeed + 2.5, SETTINGS.velocityCap);
    }
    if (e.code === 'KeyE') processCombatStrike(); // E simulates weapon shakes
    mapSimulatedSteering();
  }
  function simulateHardwareUp(e) {
    testKeys[e.code] = false;
    mapSimulatedSteering();
  }
  function mapSimulatedSteering() {
    if (runtime.padActive) return;
    runtime.steerX = (testKeys['KeyD'] || testKeys['ArrowRight'] ? 1 : 0) - (testKeys['KeyA'] || testKeys['ArrowLeft'] ? 1 : 0);
    runtime.steerY = (testKeys['KeyS'] || testKeys['ArrowDown'] ? 1 : 0) - (testKeys['KeyW'] || testKeys['ArrowUp'] ? 1 : 0);
  }

  // Combat Evaluation Engine
  function processCombatStrike() {
    if (runtime.halted) return;
    let timeStamp = Date.now();
    if (timeStamp - runtime.lastAttack < SETTINGS.combatWindow) return;
    runtime.lastAttack = timeStamp;

    // Core 2D Center Box Distance Checks
    let distanceVector = Math.sqrt(
      ((runtime.eX + 30) - (runtime.pX + 30))**2 +
      ((runtime.eY + 30) - (runtime.pY + 30))**2
    );

    if (distanceVector <= SETTINGS.hitBoxRange + 40) {
      executeBossDamage();
    } else {
      UI.status.textContent = "❌ Out of range! Move closer while jogging!";
      UI.status.style.color = "#ffaa00";
    }
  }

  function executeBossDamage() {
    UI.player.classList.remove('attack-pulse');
    void UI.player.offsetWidth;
    UI.player.classList.add('attack-pulse');

    runtime.eHP = Math.max(runtime.eHP - 20, 0);
    UI.eFill.style.width = `${runtime.eHP}%`;

    UI.enemy.classList.remove('hurt-flash');
    void UI.enemy.offsetWidth;
    UI.enemy.classList.add('hurt-flash');

    UI.status.textContent = `💥 Boss Damaged! HP: ${runtime.eHP}%`;
    UI.status.style.color = "var(--primary)";

    if (runtime.eHP <= 0) breakArenaQuest();
  }

  // Continuous Frame Physics Processor Loop
  function engineFrameTick() {
    if (runtime.halted) return;

    // Apply continuous friction decay. If user stops exercising, speed drops back to 0.
    runtime.currentSpeed *= SETTINGS.frictionFactor;
    if (runtime.currentSpeed < 0.05) {
      runtime.currentSpeed = 0;
      UI.motionInfo.textContent = "Step Power: 0.00 | Status: Idle (Exercise to move)";
      UI.motionInfo.style.color = "#6c7285";
    }

    // Multiply the directional steering layout values by the physical exercise speed pool
    runtime.pX += runtime.steerX * runtime.currentSpeed;
    runtime.pY += runtime.steerY * runtime.currentSpeed;

    // Bound constraints mapping borders
    runtime.pX = Math.max(0, Math.min(window.innerWidth - 60, runtime.pX));
    runtime.pY = Math.max(0, Math.min(window.innerHeight - 60, runtime.pY));

    refreshViewportLayouts();
    requestAnimationFrame(engineFrameTick);
  }

  function refreshViewportLayouts() {
    UI.player.style.left = `${runtime.pX}px`;
    UI.player.style.top = `${runtime.pY}px`;
    UI.enemy.style.left = `${runtime.eX}px`;
    UI.enemy.style.top = `${runtime.eY}px`;
  }

  function breakArenaQuest() {
    runtime.halted = true;
    UI.status.textContent = "🏆 QUEST COMPLETED!";
    setTimeout(() => {
      UI.overlay.innerHTML = `
        <h1 style="color: var(--primary)">WORKOUT COMPLETE</h1>
        <p style="color: #aaa; margin-bottom: 25px;">Boss cleared successfully.</p>
        <button class="cta-btn" onclick="window.location.reload()">START NEW LAP</button>
      `;
      UI.overlay.style.display = 'flex';
    }, 1200);
  }
</script>

</body>
</html>
