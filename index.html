<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitQuest: Active RPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    :root {
      --primary: #00ff66;
      --danger: #ff3333;
      --bg: #0d0e12;
      --panel: rgba(22, 24, 33, 0.85);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Prevents mobile rubber-banding/scrolling */
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1c24 0%, #0d0e12 100%);
      overflow: hidden;
    }

    /* Permission Overlay Screen */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 14, 18, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 30px;
      text-align: center;
    }

    .cta-btn {
      background: linear-gradient(135deg, var(--primary) 0%, #00b347 100%);
      border: none;
      color: #000;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 255, 102, 0.4);
      transition: transform 0.2s;
    }

    .cta-btn:active { transform: scale(0.95); }

    /* Game Entities */
    .sprite {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 12px;
      will-change: transform, left, top;
    }

    #player {
      background: linear-gradient(135deg, var(--primary) 0%, #00a3cc 100%);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
    }

    #enemy {
      background: linear-gradient(135deg, var(--danger) 0%, #990000 100%);
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
    }

    /* Animations */
    .attack-bounce { animation: attackMelee 0.25s ease-out; }
    .damage-flash { animation: flashRed 0.15s ease-in-out 2; }

    @keyframes attackMelee {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); filter: brightness(1.5); }
      100% { transform: scale(1); }
    }

    @keyframes flashRed {
      0% { opacity: 1; }
      50% { opacity: 0.4; filter: brightness(3) cubic-bezier(0, 1, 1, 0); }
      100% { opacity: 1; }
    }

    /* UI HUD System */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 10;
    }

    .top-hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .health-container { width: 42%; }

    .health-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #aaa;
    }

    .health-bar-outer {
      width: 100%;
      height: 14px;
      background: #222;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .health-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }

    #player-hp-fill { background: linear-gradient(90deg, #00ff66, #00bcff); }
    #enemy-hp-fill { background: linear-gradient(90deg, #ff3333, #ff8800); }

    .bottom-hud {
      width: 100%;
      text-align: center;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px;
    }

    #combat-log {
      height: 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #00e5ff;
    }

    /* Mobile Virtual Joystick Container */
    #joystick-zone {
      position: absolute;
      bottom: 120px;
      left: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      touch-action: none;
    }

    #joystick-handle {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid #fff;
      border-radius: 50%;
      transition: background 0.1s;
      pointer-events: none;
    }

    #screen-log {
      position: absolute;
      top: 80px;
      left: 20px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #555;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="overlay">
    <h1 style="text-transform: uppercase; letter-spacing: 2px; color: var(--primary);">FitQuest</h1>
    <p style="color: #8a8f9d; margin-bottom: 30px; max-width: 280px; font-size: 0.95rem;">
      Use the <b>virtual joystick</b> to move anywhere. Shake your device firmly to attack when close!
    </p>
    <button class="cta-btn" onclick="initializeGame()">START GAME</button>
  </div>

  <div id="screen-log"></div>

  <div id="player" class="sprite"></div>
  <div id="enemy" class="sprite"></div>

  <div id="joystick-zone">
    <div id="joystick-handle"></div>
  </div>

  <div id="ui-layer">
    <div class="top-hud">
      <div class="health-container">
        <div class="health-label">Hero HP</div>
        <div class="health-bar-outer"><div id="player-hp-fill" class="health-bar-inner"></div></div>
      </div>
      <div class="health-container" style="text-align: right;">
        <div class="health-label">Boss HP</div>
        <div class="health-bar-outer"><div id="enemy-hp-fill" class="health-bar-inner"></div></div>
      </div>
    </div>

    <div class="bottom-hud">
      <div id="combat-log">Move into range...</div>
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    shakeThreshold: 23.0,
    attackCooldown: 500,
    attackRange: 75,
    maxSpeed: 6,
    joystickRadius: 55
  };

  let state = {
    playerX: 0, playerY: 0,
    enemyX: 0, enemyY: 0,
    inputX: 0, inputY: 0, // Dynamic controller registration inputs
    playerHP: 100, enemyHP: 100,
    lastAttackTime: 0,
    isGameOver: false,
    joystickActive: false
  };

  const DOM = {
    overlay: document.getElementById('overlay'),
    player: document.getElementById('player'),
    enemy: document.getElementById('enemy'),
    playerHPFill: document.getElementById('player-hp-fill'),
    enemyHPFill: document.getElementById('enemy-hp-fill'),
    combatLog: document.getElementById('combat-log'),
    joystickZone: document.getElementById('joystick-zone'),
    joystickHandle: document.getElementById('joystick-handle'),
    debug: document.getElementById('screen-log')
  };

  function initializeGame() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(response => { if (response === 'granted') setupEngine(); else setupEngine(); })
        .catch(() => setupEngine());
    } else {
      setupEngine();
    }
  }

  function setupEngine() {
    DOM.overlay.style.display = 'none';
    
    // Initial Spawn Positions (2D Placement)
    state.playerX = 80;
    state.playerY = window.innerHeight / 2 - 30;
    state.enemyX = window.innerWidth - 140;
    state.enemyY = window.innerHeight / 2 - 30;
    
    updateSpritePositions();

    // Event Wire-up
    window.addEventListener('devicemotion', processMotion, false);
    setupJoystick();
    
    // Desktop keyboard support fallback (WASD / Arrows)
    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);

    requestAnimationFrame(gameLoop);
  }

  // Virtual Joystick Event Handler Pipeline
  function setupJoystick() {
    const zone = DOM.joystickZone;
    const handle = DOM.joystickHandle;
    const center = { x: CONFIG.joystickRadius, y: CONFIG.joystickRadius };

    function handleMove(e) {
      if (!state.joystickActive) return;
      let touch = e.touches ? e.touches[0] : e;
      let rect = zone.getBoundingClientRect();
      
      // Calculate offset distance from center of pad
      let deltaX = touch.clientX - (rect.left + center.x);
      let deltaY = touch.clientY - (rect.top + center.y);
      let distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      
      // Clamp handle vector constraint boundaries
      if (distance > CONFIG.joystickRadius) {
        deltaX = (deltaX / distance) * CONFIG.joystickRadius;
        deltaY = (deltaY / distance) * CONFIG.joystickRadius;
        distance = CONFIG.joystickRadius;
      }

      handle.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
      handle.style.background = "rgba(0, 255, 102, 0.6)";

      // Normalize inputs to a factor scale running from -1.0 to 1.0
      state.inputX = deltaX / CONFIG.joystickRadius;
      state.inputY = deltaY / CONFIG.joystickRadius;
    }

    function handleEnd() {
      state.joystickActive = false;
      handle.style.transform = `translate(0px, 0px)`;
      handle.style.background = "rgba(255, 255, 255, 0.3)";
      state.inputX = 0;
      state.inputY = 0;
    }

    zone.addEventListener('touchstart', (e) => { state.joystickActive = true; handleMove(e); }, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    // Desktop Mouse simulation for Joystick element mapping
    zone.addEventListener('mousedown', (e) => { state.joystickActive = true; handleMove(e); });
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
  }

  // Accelerator Shake Sensor Engine
  function processMotion(event) {
    if (state.isGameOver) return;
    let acc = event.accelerationIncludingGravity;
    if (!acc) return;

    let totalForce = Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);

    if (totalForce > CONFIG.shakeThreshold) {
      attemptAttack();
    }
  }

  // Desktop Simulation Control Mapping Matrix
  let keys = {};
  function handleKeyDown(e) {
    keys[e.code] = true;
    updateKeyboardInput();
    if (e.code === 'Space') attemptAttack(); // Spacebar handles screen-tap weapon action triggers
  }
  function handleKeyUp(e) {
    keys[e.code] = false;
    updateKeyboardInput();
  }
  function updateKeyboardInput() {
    if (state.joystickActive) return; // Prioritize joystick over keys
    state.inputX = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
    state.inputY = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);
  }

  // Dynamic 2D Collision Calculation Framework
  function attemptAttack() {
    if (state.isGameOver) return;
    let now = Date.now();
    if (now - state.lastAttackTime < CONFIG.attackCooldown) return;
    state.lastAttackTime = now;

    // Direct geometric Euclidean vector line calculations between elements
    let pCenterX = state.playerX + 30;
    let pCenterY = state.playerY + 30;
    let eCenterX = state.enemyX + 30;
    let eCenterY = state.enemyY + 30;

    let dist = Math.sqrt((eCenterX - pCenterX)**2 + (eCenterY - pCenterY)**2);

    if (dist <= CONFIG.attackRange + 40) {
      executeMeleeStrike();
    } else {
      DOM.combatLog.textContent = "❌ Out of Range! Move closer to the Red Boss.";
      DOM.combatLog.style.color = "#ffaa00";
    }
  }

  function executeMeleeStrike() {
    DOM.player.classList.remove('attack-bounce');
    void DOM.player.offsetWidth;
    DOM.player.classList.add('attack-bounce');

    state.enemyHP = Math.max(state.enemyHP - 20, 0);
    DOM.enemyHPFill.style.width = `${state.enemyHP}%`;
    
    DOM.enemy.classList.remove('damage-flash');
    void DOM.enemy.offsetWidth;
    DOM.enemy.classList.add('damage-flash');

    DOM.combatLog.textContent = `💥 Smacked Boss! HP Remaining: ${state.enemyHP}%`;
    DOM.combatLog.style.color = "var(--primary)";

    if (state.enemyHP <= 0) endGame(true);
  }

  // Engine Processing Ticks
  function gameLoop() {
    if (state.isGameOver) return;

    // Compute delta coordinates
    state.playerX += state.inputX * CONFIG.maxSpeed;
    state.playerY += state.inputY * CONFIG.maxSpeed;

    // Enforce 2D Screen Boundaries Constraints
    state.playerX = Math.max(0, Math.min(window.innerWidth - 60, state.playerX));
    state.playerY = Math.max(0, Math.min(window.innerHeight - 60, state.playerY));

    updateSpritePositions();
    requestAnimationFrame(gameLoop);
  }

  function updateSpritePositions() {
    DOM.player.style.left = `${state.playerX}px`;
    DOM.player.style.top = `${state.playerY}px`;
    DOM.enemy.style.left = `${state.enemyX}px`;
    DOM.enemy.style.top = `${state.enemyY}px`;
  }

  function endGame(victory) {
    state.isGameOver = true;
    DOM.combatLog.textContent = "🏆 DUNGEON CLEARED!";
    setTimeout(() => {
      DOM.overlay.innerHTML = `
        <h1 style="color: var(--primary)">QUEST CLEAR!</h1>
        <button class="cta-btn" onclick="window.location.reload()">PLAY AGAIN</button>
      `;
      DOM.overlay.style.display = 'flex';
    }, 1200);
  }
</script>

</body>
</html>
